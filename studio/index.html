<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio – Bibeli Mimo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B1E39'/><text x='50' y='68' font-size='60' font-family='Georgia,serif' font-weight='bold' fill='%23E8B14B' text-anchor='middle'>S</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .studio-landing { padding: 8px 20px 40px; max-width: 640px; margin: 0 auto; }
        .studio-hero { text-align: center; padding: 24px 0 8px; }
        .studio-hero h1 {
            font-family: var(--font-head);
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .studio-hero p {
            font-size: 15px;
            color: var(--text-soft);
            line-height: 1.5;
        }
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 28px;
        }
        .mode-card {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 26px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            min-height: 180px;
            justify-content: center;
        }
        .mode-card:active { transform: scale(0.97); box-shadow: var(--shadow-md); }
        .mode-card.disabled { opacity: 0.55; cursor: not-allowed; pointer-events: none; }
        .mode-card-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #D19A34 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(232,177,75,0.35);
        }
        .mode-card-icon.video {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            box-shadow: 0 6px 16px rgba(79,70,229,0.35);
        }
        .mode-card-icon svg { width: 26px; height: 26px; }
        .mode-card h3 {
            font-family: var(--font-head);
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin: 0;
        }
        .mode-card p {
            font-size: 12px;
            color: var(--text-soft);
            line-height: 1.45;
            margin: 0;
        }
        .mode-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 3px 8px;
            background: var(--accent);
            color: #fff;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .recent-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }
        .recent-strip::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <main class="studio-landing">
        <section class="studio-hero">
            <h1>Studio</h1>
            <p>Design beautiful Scripture content<br>in any language</p>
        </section>

        <div class="mode-grid">
            <a href="/studio/image/" class="mode-card">
                <div class="mode-card-icon">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </div>
                <h3>Image</h3>
                <p>Create a verse image</p>
            </a>

            <div class="mode-card disabled">
                <span class="mode-badge">Soon</span>
                <div class="mode-card-icon video">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <polygon points="23 7 16 12 23 17 23 7"/>
                        <rect x="1" y="5" width="15" height="14" rx="2"/>
                    </svg>
                </div>
                <h3>Video</h3>
                <p>Animated verses</p>
            </div>
        </div>

        <div class="section-head" style="margin-top:36px;">
            <h2>Coming soon</h2>
        </div>
        <p style="font-size:14px; color:var(--text-soft); line-height:1.6;">
            Video export is next. Same look you design here — animated for stories and reels.
        </p>
    </main>

    <script src="/shared.js"></script>
    <script src="/shared-nav.js"></script>
    <script>
        if (window.SharedNav) {
            window.SharedNav.init({
                title: 'Studio',
                showBack: false,
                showSearch: false,
                showBell: false,
                showMenu: true,
                showBottomNav: true,
                activeNav: ''
            });
        }
    </script>
</body>
</html>
