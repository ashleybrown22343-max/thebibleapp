<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bibeli Mimo - Image Studio</title>
    <link rel="stylesheet" href="studio.css">
</head>
<body>
    <header class="studio-header">
        <a href="index.html" class="back-btn"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg> Back</a>
        <h1>Image Studio</h1>
        <div style="width: 50px;"></div>
    </header>

    <div class="studio-container">
        <!-- STICKY PREVIEW AREA -->
        <div class="sticky-preview">
            <div id="image-preview" class="preview-card">
                <h3 id="preview-ref">Genesis 1:1</h3>
                <p id="preview-text">Loading...</p>
            </div>
        </div>

        <!-- CUSTOM PICKERS (No Native Selects) -->
        <div class="controls-section">
            <h3>Select Verse</h3>
            <div class="picker-buttons">
                <button id="pick-book" class="picker-btn">Genesis</button>
                <button id="pick-chapter" class="picker-btn">1</button>
                <button id="pick-verse" class="picker-btn">1</button>
            </div>
        </div>

        <!-- CUSTOM MODAL FOR PICKING -->
        <div id="picker-modal" class="modal-overlay" onclick="closeModal()">
            <div class="modal-content">
                <h3 id="modal-title">Select Book</h3>
                <div id="modal-list" class="modal-list"></div>
            </div>
        </div>

        <!-- TEXT CONTROLS -->
        <div class="controls-section">
            <h3>Text Settings</h3>
            
            <div class="control-row">
                <label>Font Style</label>
                <button id="studio-font-btn" onclick="toggleFont()">Sans</button>
            </div>

            <div class="control-row">
                <label>Text Size</label>
                <input type="range" id="studio-font-size" min="16" max="48" value="24" oninput="updatePreview()">
            </div>

            <div class="control-row">
                <label>Text Color</label>
                <div class="color-buttons">
                    <button style="background:#fff; color:#000;" onclick="setColor('white')">A</button>
                    <button style="background:#000; color:#fff;" onclick="setColor('black')">A</button>
                    <button style="background:#FFD700; color:#000;" onclick="setColor('gold')">A</button>
                    <button style="background:#1E90FF; color:#fff;" onclick="setColor('blue')">A</button>
                </div>
            </div>

            <div class="control-row">
                <label>Text Alignment</label>
                <div class="align-buttons">
                    <button onclick="setAlign('left')">Left</button>
                    <button onclick="setAlign('center')">Center</button>
                    <button onclick="setAlign('right')">Right</button>
                </div>
            </div>
        </div>

        <!-- LANGUAGE & ASPECT RATIO CONTROLS -->
        <div class="controls-section">
            <h3>Language & Size</h3>
            
            <div class="control-row">
                <label>Language</label>
                <div class="lang-toggle">
                    <label><input type="checkbox" id="img-yo" checked onchange="updatePreview()"> Yoruba</label>
                    <label><input type="checkbox" id="img-en" checked onchange="updatePreview()"> English</label>
                </div>
            </div>

            <div class="control-row">
                <label>Aspect Ratio</label>
                <div class="ratio-buttons">
                    <button onclick="setRatio('square')">1:1</button>
                    <button onclick="setRatio('portrait')">4:5</button>
                    <button onclick="setRatio('landscape')">16:9</button>
                </div>
            </div>
        </div>

        <!-- 500+ TEMPLATES -->
        <div class="templates-section">
            <h3>500+ Templates</h3>
            <div id="template-grid" class="template-grid"></div>
        </div>

        <!-- SHARE BUTTON -->
        <button class="share-btn" onclick="shareVerse()">Share Verse</button>
    </div>

    <script src="studio.js"></script>
</body>
                    </html>
