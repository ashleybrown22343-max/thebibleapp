<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bibeli Mimo - Image Studio</title>
    <link rel="stylesheet" href="studio.css">
</head>
<body>
    <header class="studio-header">
        <a href="index.html" class="back-btn"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg> Back</a>
        <h1>Image Studio</h1>
        <div style="width: 50px;"></div>
    </header>

    <div class="sticky-actions">
        <button class="primary-btn" onclick="downloadImage()">Download</button>
        <button class="primary-btn share" onclick="shareImage()">Share Image</button>
    </div>

    <div class="studio-container">
        <div class="sticky-preview">
            <div id="image-preview" class="preview-card">
                <h3 id="preview-ref">Psalms 23:6</h3>
                <p id="preview-text">Loading...</p>
            </div>
        </div>

        <div class="controls-section">
            <h3>Select Verse</h3>
            <div class="picker-buttons">
                <button id="pick-book" class="picker-btn">Psalms</button>
                <button id="pick-chapter" class="picker-btn">23</button>
                <button id="pick-verse" class="picker-btn">6</button>
            </div>
        </div>

        <div id="picker-modal" class="modal-overlay" onclick="closeModal()">
            <div class="modal-content">
                <h3 id="modal-title">Select Book</h3>
                <div id="modal-list" class="modal-list"></div>
            </div>
        </div>

        <div class="controls-section">
            <h3>Layout & Background</h3>
            <div class="control-row"><label>Aspect Ratio</label><div class="ratio-buttons"><button onclick="setRatio('square')">1:1</button><button onclick="setRatio('portrait')">4:5</button><button onclick="setRatio('landscape')">16:9</button></div></div>
            <div class="control-row"><label>Text Position</label><div class="align-buttons"><button onclick="setVert('top')">Top</button><button onclick="setVert('center')">Center</button><button onclick="setVert('bottom')">Bottom</button></div></div>
            <div class="control-row"><label>Watermark</label><button id="watermark-btn" onclick="toggleWatermark()">ON</button></div>
        </div>

        <div class="controls-section">
            <h3>Text Design</h3>
            <div class="control-row" style="justify-content:flex-end; border-bottom:none;">
                <button onclick="resetToAutoFit()" style="background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-size: 14px; font-weight: bold;">Reset to Auto-Fit</button>
            </div>
            <div class="control-row"><label>Font Style</label><button id="studio-font-btn" onclick="toggleFont()">Sans</button></div>
            <div class="control-row"><label>Font Size</label><input type="range" id="studio-font-size" min="20" max="60" value="32" oninput="manualFontSize(this.value)"></div>
            <div class="control-row"><label>Line Spacing</label><input type="range" id="studio-line-spacing" min="1.0" max="2.5" step="0.1" value="1.7" oninput="manualLineSpacing(this.value)"></div>
            <div class="control-row"><label>Text Padding</label><input type="range" id="studio-padding" min="10" max="60" value="20" oninput="manualPadding(this.value)"></div>
            <div class="control-row"><label>Text Shadow</label><button id="shadow-btn" onclick="toggleShadow()">ON</button></div>
            <div class="control-row"><label>Text Color</label><div class="color-buttons"><button style="background:#fff; color:#000;" onclick="setColor('white')">A</button><button style="background:#000; color:#fff;" onclick="setColor('black')">A</button><button style="background:#FFD700; color:#000;" onclick="setColor('gold')">A</button><button style="background:#1E90FF; color:#fff;" onclick="setColor('blue')">A</button></div></div>
            <div class="control-row"><label>Alignment</label><div class="align-buttons"><button onclick="setAlign('left')">Left</button><button onclick="setAlign('center')">Center</button><button onclick="setAlign('right')">Right</button></div></div>
            <div class="control-row"><label>Language</label><div class="lang-toggle"><label><input type="checkbox" id="img-yo" checked onchange="updatePreview()"> Yoruba</label><label><input type="checkbox" id="img-en" checked onchange="updatePreview()"> English</label></div></div>
        </div>

        <div class="templates-section">
            <h3>500+ Premium Templates</h3>
            <div id="template-grid" class="template-grid"></div>
        </div>
    </div>

    <script src="studio.js"></script>
</body>
                                                                                                                                   </html>
