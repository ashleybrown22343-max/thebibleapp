<!DOCTYPE html>
<html lang="en">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0B1E39 0%, #142C52 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .box { max-width: 380px; width: 100%; }
        .icon {
            width: 96px;
            height: 96px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(232,177,75,0.15);
            color: #E8B14B;
        }
        .icon svg { width: 48px; height: 48px; }
        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            color: #8A9BB5;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px 24px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-primary { background: #E8B14B; color: #0B1E39; }
        .btn-secondary {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn svg { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>

                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>

        </div>
        <h1>No Internet</h1>
        <p>This page needs internet to load. Reconnect to Wi-Fi or mobile data, then try again.</p>
        <button class="btn btn-primary" onclick="location.reload()">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Try Again
        </button>
        <a href="/" class="btn btn-secondary">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Home
        </a>
    </div>
