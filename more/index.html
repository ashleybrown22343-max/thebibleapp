<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>More – Bibeli Mimo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B1E39'/><text x='50' y='68' font-size='60' font-family='Georgia,serif' font-weight='bold' fill='%23E8B14B' text-anchor='middle'>B</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .more-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            text-decoration: none;
            color: inherit;
        }
        .more-card:active {
            transform: scale(0.98);
            border-color: var(--accent);
        }
        .more-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }
        .more-icon svg { width: 22px; height: 22px; }
        .more-body { flex: 1; min-width: 0; }
        .more-title {
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 3px;
        }
        .more-desc {
            font-size: 12px;
            color: var(--text-soft);
            line-height: 1.4;
        }
        .more-arrow {
            color: var(--text-soft);
            flex-shrink: 0;
        }
        .more-arrow svg { width: 18px; height: 18px; }

        .more-section-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-soft);
            margin: 24px 0 10px;
            padding-left: 4px;
        }

        .more-footer {
            text-align: center;
            padding: 40px 20px 20px;
            color: var(--text-soft);
        }
        .more-footer-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 28px;
            margin: 0 auto 12px;
        }
        .more-footer-name {
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .more-footer-version {
            font-size: 12px;
            color: var(--text-soft);
            letter-spacing: 0.5px;
        }
        .more-footer-tagline {
            font-size: 11px;
            color: var(--text-soft);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <main class="page-container">

        <h2 class="more-section-title">Explore</h2>

        <a class="more-card" href="/studio/">
            <div class="more-icon">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <div class="more-body">
                <div class="more-title">Image Studio</div>
                <div class="more-desc">Create beautiful verse images</div>
            </div>
            <div class="more-arrow">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
        </a>

        <a class="more-card" href="/settings/">
            <div class="more-icon">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
            <div class="more-body">
                <div class="more-title">Settings</div>
                <div class="more-desc">Themes, font size, language, notifications</div>
            </div>
            <div class="more-arrow">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
        </a>

        <a class="more-card" href="/about/">
            <div class="more-icon">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </div>
            <div class="more-body">
                <div class="more-title">About Bibeli Mimo</div>
                <div class="more-desc">Version, credits, licenses</div>
            </div>
            <div class="more-arrow">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
        </a>

        <h2 class="more-section-title">Support</h2>

        <div class="more-card" id="share-app-btn">
            <div class="more-icon">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </div>
            <div class="more-body">
                <div class="more-title">Share App</div>
                <div class="more-desc">Tell your friends and church</div>
            </div>
            <div class="more-arrow">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
        </div>

        <div class="more-card" id="feedback-btn">
            <div class="more-icon">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <div class="more-body">
                <div class="more-title">Send Feedback</div>
                <div class="more-desc">Report a bug or request a feature</div>
            </div>
            <div class="more-arrow">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
        </div>

        <div class="more-footer">
            <div class="more-footer-logo">B</div>
            <div class="more-footer-name">Bibeli Mimo</div>
            <div class="more-footer-version">Version 1.0.0</div>
            <div class="more-footer-tagline">Made for the Church</div>
        </div>

    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/shared.js"></script>
    <script src="/shared-nav.js"></script>
    <script src="/more/more.js"></script>
</body>
  </html>
