<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bibeli Mimo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B1E39'/><text x='50' y='68' font-size='60' font-family='Georgia,serif' font-weight='bold' fill='%23E8B14B' text-anchor='middle'>B</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="page-container" style="padding-top:8px;">

        <!-- Greeting -->
        <section class="home-hero">
            <div class="home-greeting" id="greeting">Good Morning</div>
            <div class="home-date" id="date-line">Monday, 15 September</div>
        </section>

        <!-- Verse of the Day -->
        <section id="votd-card" class="votd-card" style="background:#0B1E39;">
            <div class="votd-bg" id="votd-bg"></div>
            <div class="votd-content">
                <div class="votd-label">Verse of the Day</div>
                <div class="votd-text" id="votd-text">Loading...</div>
                <div class="votd-ref" id="votd-ref"></div>
                <div class="votd-actions">
                    <button class="votd-btn" id="votd-read">
                        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                        Read
                    </button>
                    <button class="votd-btn" id="votd-share">
                        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        Share
                    </button>
                    <button class="votd-btn" id="votd-studio">
                        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        Image
                    </button>
                </div>
            </div>
        </section>

        <!-- Continue Reading -->
        <section class="card card-clickable continue-card" id="continue-card">
            <div class="continue-icon">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </div>
            <div class="continue-info">
                <div class="continue-label">Continue Reading</div>
                <div class="continue-title" id="continue-title">Genesis 1</div>
            </div>
            <div class="continue-arrow">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
        </section>

        <!-- Today's Plan -->
        <section class="card card-clickable plan-card" id="plan-card">
            <div class="plan-head">
                <div class="plan-title">Today's Plan</div>
                <div class="plan-percent" id="plan-percent">0%</div>
            </div>
            <div class="plan-text" id="plan-text">Set your reading plan</div>
            <div class="progress-track">
                <div class="progress-fill" id="plan-progress"></div>
            </div>
            <div class="plan-meta">
                <span id="plan-done">0 chapters</span>
                <span id="plan-total">0 total</span>
            </div>
        </section>

        <!-- Quick Actions -->
        <div class="section-head">
            <h2>Quick Actions</h2>
        </div>
        <div class="quick-grid">
            <button class="quick-tile" id="qa-random">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                <span>Random</span>
            </button>
            <a class="quick-tile" href="/discover/search/">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Search</span>
            </a>
            <a class="quick-tile" href="/library/notes/">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="13" y2="11"/></svg>
                <span>Notes</span>
            </a>
            <a class="quick-tile" href="/studio/">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span>Studio</span>
            </a>
        </div>

        <!-- Recently Read -->
        <div class="section-head" id="recent-head" style="display:none;">
            <h2>Recently Read</h2>
        </div>
        <div class="recent-scroll" id="recent-scroll"></div>

    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/shared.js"></script>
    <script src="/shared-nav.js"></script>
    <script src="/home.js"></script>
</body>
    </html>
