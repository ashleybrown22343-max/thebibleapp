<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bibeli Mimo</title>
    <style>
        :root { --bg: #f8f9fa; --text: #212529; --card: #ffffff; --accent: #f59e0b; --border: #e9ecef; --header: #0f172a; }
        body.dark { --bg: #121212; --text: #e0e0e0; --card: #1e1e1e; --border: #333; --header: #000; }
        body.church { --bg: #000; --text: #ffff00; --card: #000; --border: #ffff00; --header: #000; font-size: 24px; line-height: 1.8; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; transition: 0.3s; }
        .splash { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--header); color: white; }
        .header { background: var(--header); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 15px; } .header h2 { margin: 0; font-size: 20px; } .header p { margin: 0; font-size: 12px; opacity: 0.8; }
        .icon-btn { background: none; border: none; color: var(--text); cursor: pointer; } .header .icon-btn { color: white; }
        .icon { width: 24px; height: 24px; } .icon-lg { width: 32px; height: 32px; }
        .screen { display: none; padding: 20px; } .screen.active { display: block; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px; }
        .card:active { transform: scale(0.98); }
        .continue-card { border-left: 5px solid var(--accent); } .plan-card { border-left: 5px solid #1a73e8; }
        .votd-card { background: linear-gradient(135deg, #1a237e, #0f172a); color: white; display: block; cursor: default; }
        .card-content h3 { margin: 0 0 5px 0; font-size: 18px; } .card-content p { margin: 0; font-size: 14px; opacity: 0.7; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-btn { background: none; border: none; color: var(--text); opacity: 0.6; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-btn.active { color: var(--accent); opacity: 1; }
        .section-title { font-weight: 700; margin: 20px 0 10px; font-size: 18px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; text-align: center; font-weight: 600; cursor: pointer; }
        .grid-item.red { color: #d32f2f; }
        .history-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; }
        .history-item { min-width: 120px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; text-align: center; font-weight: 600; }
        .reading-content { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .verse-container { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .verse-number { font-weight: 800; color: var(--accent); font-size: 24px; display: block; margin-bottom: 5px; }
        .yoruba-text { font-weight: 600; font-size: 1.2em; margin: 8px 0; } .english-text { opacity: 0.7; font-size: 0.95em; margin: 0; }
        .highlight-yellow { background-color: #fff9c4; } .highlight-green { background-color: #c8e6c9; } .highlight-blue { background-color: #bbdefb; }
        .chapter-nav { display: flex; justify-content: space-between; margin-top: 20px; } .chapter-nav button { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px 20px; color: var(--text); font-size: 16px; cursor: pointer; }
        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 400; display: none; }
        .action-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-radius: 20px 20px 0 0; z-index: 401; padding: 20px; transform: translateY(100%); transition: transform 0.3s ease; }
        .action-sheet.show { transform: translateY(0); }
        .sheet-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .sheet-item { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px 5px; background: var(--bg); border-radius: 10px; cursor: pointer; font-size: 12px; }
        .sheet-item svg { color: var(--accent); margin-bottom: 5px; }
        .cancel-btn { width: 100%; padding: 15px; background: var(--bg); border: none; border-radius: 10px; font-weight: bold; color: var(--text); cursor: pointer; }
        .note-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; background: var(--card); border-radius: 12px; z-index: 401; padding: 20px; display: none; }
        .note-modal textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; font-size: 16px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; } .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; }
        .floating-btn { position: fixed; bottom: 90px; right: 20px; background: var(--accent); border: none; border-radius: 50%; width: 60px; height: 60px; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 200; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="splash-screen" class="splash"><h1>Bibeli Mimo</h1><p>Loading...</p></div>
    <div id="app-container" style="display: none;">
        <header class="header">
            <div><h2 id="greeting">Good Morning</h2><p>Bibeli Mimo</p></div>
            <div class="header-actions">
                <button id="search-btn" class="icon-btn">🔍</button>
                <button id="theme-btn" class="icon-btn">🌙</button>
            </div>
        </header>
        <div id="screen-home" class="screen active">
            <div class="card continue-card" onclick="continueReading()">
                <div class="card-content"><h3>Continue Reading</h3><p id="last-read">Genesis 1</p></div>
            </div>
            <div class="card votd-card"><h3>Verse of the Day</h3><p id="votd">Loading...</p></div>
            <div class="card plan-card" onclick="loadPlanChapter()">
                <div class="card-content"><h3>Today's Plan</h3><p id="plan-text">Bible in 1 Year: Genesis 1</p></div>
            </div>
            <h3 class="section-title">Recently Read</h3>
            <div id="history-list" class="history-list"></div>
        </div>
        <div id="screen-books" class="screen">
            <h2 class="section-title">Old Testament</h2><div id="ot-grid" class="grid"></div>
            <h2 class="section-title">New Testament</h2><div id="nt-grid" class="grid"></div>
        </div>
        <div id="screen-chapters" class="screen">
            <button class="back-btn" onclick="switchTab('books')">← Back</button>
            <h2 id="chapter-title" class="section-title">Genesis</h2>
            <div id="chapter-grid" class="grid"></div>
        </div>
        <div id="screen-reading" class="screen">
            <div class="reading-header">
                <button class="icon-btn" onclick="goToChapters()">←</button>
                <h2 id="reading-title">Genesis 1</h2>
                <div class="reader-actions">
                    <button id="audio-btn" class="icon-btn">🔊</button>
                    <button id="share-btn" class="icon-btn">📤</button>
                    <div class="font-controls"><button onclick="changeFont(-1)">A-</button><button onclick="changeFont(1)">A+</button></div>
                </div>
            </div>
            <div id="bible-text" class="reading-content"></div>
            <div class="chapter-nav"><button onclick="prevChapter()">Previous</button><button onclick="nextChapter()">Next</button></div>
        </div>
        <div id="screen-saved" class="screen">
            <h2>My Library</h2>
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchLibrary('saved')">Saved</button>
                <button class="tab-btn" onclick="switchLibrary('notes')">Notes</button>
            </div>
            <div id="library-list"></div>
        </div>
        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="switchTab('home')">🏠<span>Home</span></button>
            <button class="nav-btn" onclick="switchTab('books')">📖<span>Books</span></button>
            <button class="nav-btn" onclick="switchTab('saved')">🔖<span>Library</span></button>
        </nav>
    </div>

    <div id="action-sheet-overlay" class="sheet-overlay" onclick="closeActionSheet()"></div>
    <div id="action-sheet" class="action-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header" id="sheet-verse-ref">Genesis 1:1</div>
        <div class="sheet-actions">
            <div class="sheet-item" onclick="copyVerse()">📋<span>Copy</span></div>
            <div class="sheet-item" onclick="readVerse()">🔊<span>Read</span></div>
            <div class="sheet-item" onclick="actionHighlight()">🖍️<span>Highlight</span></div>
            <div class="sheet-item" onclick="openNoteModal()">📝<span>Note</span></div>
            <div class="sheet-item" onclick="saveVerse()">🔖<span>Save</span></div>
        </div>
        <button class="cancel-btn" onclick="closeActionSheet()">Cancel</button>
    </div>

    <div id="note-overlay" class="sheet-overlay" onclick="closeNoteModal()"></div>
    <div id="note-modal" class="note-modal">
        <h3>Add Note</h3>
        <textarea id="note-input" placeholder="Type your note here..."></textarea>
        <div class="modal-buttons"><button onclick="closeNoteModal()">Cancel</button><button onclick="saveNote()" class="save-btn">Save</button></div>
    </div>

    <button id="church-mode-btn" class="floating-btn">⛪</button>

    <script>
        let yoruba = [], english = [], englishMap = {};
        let saved = JSON.parse(localStorage.getItem('saved') || '[]');
        let notes = JSON.parse(localStorage.getItem('notes') || '{}');
        let highlights = JSON.parse(localStorage.getItem('highlights') || '{}');
        let history = JSON.parse(localStorage.getItem('history') || '[]');
        let currentBook = "GEN", currentBookName = "Genesis", currentChapter = 1;
        let currentFontSize = parseInt(localStorage.getItem('fontSize') || '100');
        let currentEnglishChapterText = '';
        let currentLibrary = 'saved';
        let activeVerse = { b: 0, c: 0, v: 0 };

        const codes = ["GEN","EXO","LEV","NUM","DEU","JOS","JDG","RUT","1SA","2SA","1KI","2KI","1CH","2CH","EZR","NEH","EST","JOB","PSA","PRO","ECC","SNG","ISA","JER","LAM","EZK","DAN","HOS","JOL","AMO","OBA","JON","MIC","NAM","HAB","ZEP","HAG","ZEC","MAL","MAT","MRK","LUK","JHN","ACT","ROM","1CO","2CO","GAL","EPH","PHP","COL","1TH","2TH","1TI","2TI","TIT","PHM","HEB","JAS","1PE","2PE","1JN","2JN","3JN","JUD","REV"];
        const englishNames = ["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];

        async function init() {
            try {
                const splash = document.getElementById('splash-screen');
                const app = document.getElementById('app-container');
                const yRes = await fetch('data/yoruba.json');
                if (!yRes.ok) throw new Error("Yoruba data not found");
                yoruba = await yRes.json();
                try {
                    const eRes = await fetch('data/english_net.json');
                    if (eRes.ok) { english = await eRes.json(); english.forEach(v => englishMap[`${v.book}-${v.chapter}-${v.verse}`] = v.text); }
                } catch (e) {}
                splash.style.display = 'none';
                app.style.display = 'block';
                loadHome(); buildBooks();
                document.getElementById('search-btn').onclick = toggleSearch;
                document.getElementById('audio-btn').onclick = playAudio;
                document.getElementById('share-btn').onclick = shareChapter;
                document.getElementById('theme-btn').onclick = toggleTheme;
                document.getElementById('church-mode-btn').onclick = toggleChurch;
            } catch(e) { splash.innerHTML = "<h3>Error: " + e.message + "</h3>"; }
        }

        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + tab).classList.add('active');
            if(tab === 'home') document.querySelectorAll('.nav-btn')[0].classList.add('active');
            if(tab === 'books') document.querySelectorAll('.nav-btn')[1].classList.add('active');
            if(tab === 'saved') { document.querySelectorAll('.nav-btn')[2].classList.add('active'); loadLibrary(); }
        }

        function loadHome() {
            const hour = new Date().getHours();
            document.getElementById('greeting').textContent = hour < 12 ? "Good Morning" : hour < 18 ? "Good Afternoon" : "Good Evening";
            const last = JSON.parse(localStorage.getItem('lastRead') || '{"b":"GEN","c":1}');
            document.getElementById('last-read').textContent = `${englishNames[codes.indexOf(last.b)]} ${last.c}`;
            const day = new Date().getDate();
            if(yoruba[day * 500]) document.getElementById('votd').textContent = yoruba[day * 500].text;
            const now = new Date(), start = new Date(now.getFullYear(), 0, 0);
            const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
            const allChapters = [...new Set(yoruba.map(v => `${v.book}-${v.chapter}`))];
            const target = allChapters[dayOfYear % allChapters.length].split('-');
            document.getElementById('plan-text').textContent = `Bible in 1 Year: ${englishNames[parseInt(target[0]) - 1]} ${target[1]}`;
            const histContainer = document.getElementById('history-list');
            histContainer.innerHTML = '';
            history.forEach(h => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.textContent = `${englishNames[codes.indexOf(h.b)]} ${h.c}`;
                div.onclick = () => { currentBook = h.b; currentBookName = englishNames[codes.indexOf(h.b)]; currentChapter = h.c; loadChapter(); };
                histContainer.appendChild(div);
            });
        }

        function loadPlanChapter() {
            const now = new Date(), start = new Date(now.getFullYear(), 0, 0);
            const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
            const allChapters = [...new Set(yoruba.map(v => `${v.book}-${v.chapter}`))];
            const target = allChapters[dayOfYear % allChapters.length].split('-');
            currentBook = codes[parseInt(target[0]) - 1];
            currentBookName = englishNames[parseInt(target[0]) - 1];
            currentChapter = parseInt(target[1]);
            loadChapter();
        }

        function buildBooks() {
            const otGrid = document.getElementById('ot-grid');
            const ntGrid = document.getElementById('nt-grid');
            for(let i=0; i<englishNames.length; i++) {
                const div = document.createElement('div');
                div.className = i >= 39 ? 'grid-item red' : 'grid-item';
                div.textContent = englishNames[i];
                div.onclick = () => { currentBook = codes[i]; currentBookName = englishNames[i]; buildChapters(); };
                (i >= 39 ? ntGrid : otGrid).appendChild(div);
            }
        }

        function buildChapters() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-chapters').classList.add('active');
            document.getElementById('chapter-title').textContent = currentBookName;
            const bookNum = codes.indexOf(currentBook) + 1;
            const maxCh = Math.max(...yoruba.filter(v => v.book === bookNum).map(v => v.chapter));
            const grid = document.getElementById('chapter-grid');
            grid.innerHTML = '';
            for(let i=1; i<=maxCh; i++) {
                const div = document.createElement('div');
                div.className = 'grid-item';
                div.textContent = i;
                div.onclick = () => { currentChapter = i; loadChapter(); };
                grid.appendChild(div);
            }
        }

        function goToChapters() { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('screen-chapters').classList.add('active'); }

        function loadChapter() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-reading').classList.add('active');
            document.getElementById('reading-title').textContent = `${currentBookName} ${currentChapter}`;
            const bookNum = codes.indexOf(currentBook) + 1;
            const verses = yoruba.filter(v => v.book === bookNum && v.chapter === currentChapter);
            let html = ''; currentEnglishChapterText = '';
            verses.forEach(v => {
                const eng = englishMap[`${v.book}-${v.chapter}-${v.verse}`] || ""; currentEnglishChapterText += eng + ' ';
                const key = `${v.book}-${v.chapter}-${v.verse}`;
                const note = notes[key];
                const highlightClass = highlights[key] ? `highlight-${highlights[key]}` : '';
                html += `<div class="verse-container ${highlightClass}" onclick="openActionSheet(${v.book}, ${v.chapter}, ${v.verse})"><span class="verse-number">${v.verse}</span><p class="yoruba-text">${v.text}</p><p class="english-text">${eng}</p>${note ? `<div class="note-text">${note}</div>` : ''}</div>`;
            });
            document.getElementById('bible-text').innerHTML = html;
            document.getElementById('bible-text').style.fontSize = currentFontSize + '%';
            const currentHistory = { b: currentBook, c: currentChapter };
            history = history.filter(h => h.b !== currentHistory.b || h.c !== currentHistory.c);
            history.unshift(currentHistory);
            if (history.length > 10) history.pop();
            localStorage.setItem('history', JSON.stringify(history));
            localStorage.setItem('lastRead', JSON.stringify({b: currentBook, c: currentChapter}));
            let startX = 0;
            const el = document.getElementById('bible-text');
            el.ontouchstart = e => startX = e.changedTouches[0].screenX;
            el.ontouchend = e => { let endX = e.changedTouches[0].screenX; if (endX < startX - 50) nextChapter(); if (endX > startX + 50) prevChapter(); };
        }

        function nextChapter() { if(currentChapter < 150) { currentChapter++; loadChapter(); } }
        function prevChapter() { if(currentChapter > 1) { currentChapter--; loadChapter(); } }
        function continueReading() { const last = JSON.parse(localStorage.getItem('lastRead') || '{"b":"GEN","c":1}'); currentBook = last.b; currentBookName = englishNames[codes.indexOf(currentBook)]; currentChapter = last.c; loadChapter(); }
        function changeFont(delta) { currentFontSize += delta * 10; if (currentFontSize < 80) currentFontSize = 80; if (currentFontSize > 150) currentFontSize = 150; localStorage.setItem('fontSize', currentFontSize); document.getElementById('bible-text').style.fontSize = currentFontSize + '%'; }

        function openActionSheet(b, c, v) {
            activeVerse = { b: b, c: c, v: v };
            document.getElementById('sheet-verse-ref').textContent = `${englishNames[b-1]} ${c}:${v}`;
            document.getElementById('action-sheet-overlay').style.display = 'block';
            const sheet = document.getElementById('action-sheet');
            setTimeout(() => sheet.classList.add('show'), 10);
        }
        function closeActionSheet() { const sheet = document.getElementById('action-sheet'); sheet.classList.remove('show'); setTimeout(() => document.getElementById('action-sheet-overlay').style.display = 'none', 200); }
        function copyVerse() { const verseObj = yoruba.find(x => x.book === activeVerse.b && x.chapter === activeVerse.c && x.verse === activeVerse.v); const eng = englishMap[`${activeVerse.b}-${activeVerse.c}-${activeVerse.v}`] || ""; navigator.clipboard.writeText(`${verseObj.text}\n${eng}`).then(() => closeActionSheet()); }
        function readVerse() { closeActionSheet(); const eng = englishMap[`${activeVerse.b}-${activeVerse.c}-${activeVerse.v}`] || ""; const u = new SpeechSynthesisUtterance(eng); u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }
        function actionHighlight() { const key = `${activeVerse.b}-${activeVerse.c}-${activeVerse.v}`; const order = ['yellow', 'green', 'blue', 'none']; const current = highlights[key] || 'none'; const next = order[(order.indexOf(current) + 1) % order.length]; if (next === 'none') delete highlights[key]; else highlights[key] = next; localStorage.setItem('highlights', JSON.stringify(highlights)); closeActionSheet(); loadChapter(); }
        function saveVerse() { const key = `${activeVerse.b}-${activeVerse.c}-${activeVerse.v}`; if(!saved.includes(key)) { saved.push(key); localStorage.setItem('saved', JSON.stringify(saved)); closeActionSheet(); } else { saved = saved.filter(k => k !== key); localStorage.setItem('saved', JSON.stringify(saved)); closeActionSheet(); } }
        function openNoteModal() { const key = `${activeVerse.b}-${activeVerse.c}-${activeVerse.v}`; document.getElementById('note-input').value = notes[key] || ""; document.getElementById('note-overlay').style.display = 'block'; document.getElementById('note-modal').style.display = 'block'; }
        function closeNoteModal() { document.getElementById('note-overlay').style.display = 'none'; document.getElementById('note-modal').style.display = 'none'; document.getElementById('action-sheet-overlay').style.display = 'block'; document.getElementById('action-sheet').classList.add('show'); }
        function saveNote() { const key = `${activeVerse.b}-${activeVerse.c}-${activeVerse.v}`; const text = document.getElementById('note-input').value; if (text.trim() === "") delete notes[key]; else notes[key] = text; localStorage.setItem('notes', JSON.stringify(notes)); closeNoteModal(); loadChapter(); }
        function switchLibrary(type) { currentLibrary = type; document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); if (type === 'saved') document.querySelectorAll('.tab-btn')[0].classList.add('active'); else document.querySelectorAll('.tab-btn')[1].classList.add('active'); loadLibrary(); }
        function loadLibrary() { const list = document.getElementById('library-list'); list.innerHTML = ''; if (currentLibrary === 'saved') { saved.forEach(key => { const [b,c,v] = key.split('-').map(Number); const verse = yoruba.find(x => x.book === b && x.chapter === c && x.verse === v); if(verse) { const div = document.createElement('div'); div.className = 'card'; div.innerHTML = `<strong>${englishNames[b-1]} ${c}:${v}</strong><p>${verse.text}</p>`; div.onclick = () => { removeBookmark(key); }; list.appendChild(div); } }); if (list.innerHTML === '') list.innerHTML = '<p>Tap any verse to save it.</p>'; } else { for (const key in notes) { const [b,c,v] = key.split('-').map(Number); const verse = yoruba.find(x => x.book === b && x.chapter === c && x.verse === v); if(verse) { const div = document.createElement('div'); div.className = 'card'; div.innerHTML = `<strong>${englishNames[b-1]} ${c}:${v}</strong><p>${verse.text}</p><p class="note-text">${notes[key]}</p>`; div.onclick = () => { delete notes[key]; localStorage.setItem('notes', JSON.stringify(notes)); loadLibrary(); }; list.appendChild(div); } } if (list.innerHTML === '') list.innerHTML = '<p>Tap the pencil icon to add a note.</p>'; } }
        function removeBookmark(key) { saved = saved.filter(k => k !== key); localStorage.setItem('saved', JSON.stringify(saved)); loadLibrary(); }
        function toggleSearch() { const o = document.getElementById('search-overlay'); if(o.style.display === 'block') { o.style.display = 'none'; } else { o.style.display = 'block'; document.getElementById('search-input').focus(); } }
        function jumpToVerse(b,c,v) { currentBook = codes[b-1]; currentBookName = englishNames[b-1]; currentChapter = c; loadChapter(); }
        function playAudio() { if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; } const u = new SpeechSynthesisUtterance(currentEnglishChapterText); u.lang = 'en-US'; speechSynthesis.speak(u); }
        function shareChapter() { const text = document.getElementById('bible-text').innerText; if(navigator.share) navigator.share({ title: `${currentBookName} ${currentChapter}`, text: text }); else alert(text); }
        function toggleTheme() { document.body.classList.toggle('dark'); }
        function toggleChurch() { document.body.classList.toggle('church'); }

        window.onload = init;
    </script>
</body>
</html>
