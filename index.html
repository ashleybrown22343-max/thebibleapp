<!DOCTYPE html>
<html lang="yo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoruba & English Bible</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header><h1>Bibeli Mimo</h1></header>
    <main>
        <div class="controls">
            <select id="book-select">
                <option value="GEN">Genesis</option>
                <option value="EXO">Exodus</option>
                <option value="JHN">John</option>
            </select>
            <input type="number" id="chapter-input" placeholder="Chapter" min="1" value="1">
            <button id="load-btn">Read</button>
        </div>
        <div class="bible-text" id="bible-text"><p>Loading...</p></div>
    </main>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
