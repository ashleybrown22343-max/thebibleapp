<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bibeli Mimo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>
<body>
    <div id="splash-screen" class="splash"><div class="logo">📖</div><h1>Bibeli Mimo</h1><p>Loading...</p></div>
    <div id="app-container" style="display: none;">
        <header class="header">
            <div><h2 id="greeting">Good Morning</h2><p>Bibeli Mimo</p></div>
            <div class="header-actions">
                <button id="search-btn" class="icon-btn"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg></button>
                <button id="theme-btn" class="icon-btn"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg></button>
            </div>
        </header>

        <!-- Screen 1: Home (With History) -->
        <div id="screen-home" class="screen active">
            <div class="card continue-card" onclick="continueReading()">
                <div class="card-icon"><svg fill="none" class="icon-lg" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg></div>
                <div class="card-content"><h3>Continue Reading</h3><p id="last-read">Genesis 1</p></div>
            </div>
            
            <div class="card votd-card"><h3>Verse of the Day</h3><p id="votd">Loading...</p></div>

            <h3 class="section-title">Recently Read</h3>
            <div id="history-list" class="history-list"></div>

            <div class="card nav-card" onclick="switchTab('books')">
                <div class="card-icon"><svg fill="none" class="icon-lg" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg></div>
                <div class="card-content"><h3>Start Reading</h3><p>Browse all books</p></div>
            </div>
        </div>

        <!-- Screen 2: Books -->
        <div id="screen-books" class="screen">
            <h2 class="section-title">Old Testament</h2><div id="ot-grid" class="grid"></div>
            <h2 class="section-title">New Testament</h2><div id="nt-grid" class="grid"></div>
        </div>

        <!-- Screen 3: Chapters -->
        <div id="screen-chapters" class="screen">
            <button class="back-btn" onclick="switchTab('books')"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg></button>
            <h2 id="chapter-title" class="section-title">Genesis</h2>
            <div id="chapter-grid" class="grid"></div>
        </div>

        <!-- Screen 4: READER (With Note & Highlight Buttons) -->
        <div id="screen-reading" class="screen">
            <div class="reading-header">
                <button class="icon-btn" onclick="goToChapters()"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg></button>
                <h2 id="reading-title">Genesis 1</h2>
                <div class="reader-actions">
                    <button id="audio-btn" class="icon-btn"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg></button>
                    <button id="share-btn" class="icon-btn"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg></button>
                    <div class="font-controls"><button onclick="changeFont(-1)">A-</button><button onclick="changeFont(1)">A+</button></div>
                </div>
            </div>
            <div id="bible-text" class="reading-content"></div>
            <div class="chapter-nav"><button onclick="prevChapter()">Previous</button><button onclick="nextChapter()">Next</button></div>
        </div>

        <!-- Screen 5: Library (Saved, Notes, Highlights) -->
        <div id="screen-saved" class="screen">
            <h2>My Library</h2>
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchLibrary('saved')">Saved</button>
                <button class="tab-btn" onclick="switchLibrary('notes')">Notes</button>
            </div>
            <div id="library-list"></div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="switchTab('home')"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg><span>Home</span></button>
            <button class="nav-btn" onclick="switchTab('books')"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg><span>Books</span></button>
            <button class="nav-btn" onclick="switchTab('saved')"><svg fill="none" class="icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg><span>Library</span></button>
        </nav>
    </div>

    <div id="search-overlay" class="overlay">
        <div class="overlay-header">
            <input type="text" id="search-input" placeholder="Search Yoruba or English...">
            <button onclick="toggleSearch()">Close</button>
        </div>
        <div id="search-results"></div>
    </div>

    <button id="church-mode-btn" class="floating-btn" title="Elder Mode">⛪</button>
    <script src="app.js"></script>
</body>
    </html>
