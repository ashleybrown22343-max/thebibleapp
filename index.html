<!DOCTYPE html>
<html lang="yo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bibeli Mimo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="spinner"></div>
        <p>Loading Bible...</p>
    </div>

    <!-- Header -->
    <header class="app-header">
        <button id="menu-btn" class="icon-btn">☰</button>
        <h1>Bibeli Mimo</h1>
        <button id="theme-toggle" class="icon-btn">🌙</button>
    </header>

    <!-- Drawer -->
    <div id="side-drawer" class="drawer">
        <div class="drawer-header">
            <img src="icon-192.png" alt="Logo">
            <h2>Settings</h2>
        </div>
        <div class="drawer-item">
            <span>Font Size</span>
            <div class="font-controls">
                <button onclick="changeFont(-1)">A-</button>
                <span id="font-size-label">100%</span>
                <button onclick="changeFont(1)">A+</button>
            </div>
        </div>
        <div class="drawer-item" onclick="toggleHighContrast()">
            <span>High Contrast Mode</span>
            <span class="toggle-btn" id="hc-toggle">OFF</span>
        </div>
        <div class="drawer-item" onclick="shareApp()">
            <span>Share App</span>
            <span>➜</span>
        </div>
    </div>

    <!-- Main Screens -->
    <main>
        <!-- Book Selection -->
        <div id="screen-books" class="screen active">
            <h2 class="section-title">Old Testament</h2>
            <div id="ot-grid" class="grid-container"></div>
            <h2 class="section-title">New Testament</h2>
            <div id="nt-grid" class="grid-container"></div>
        </div>

        <!-- Chapter Selection -->
        <div id="screen-chapters" class="screen">
            <button class="back-btn" onclick="goToBooks()">← Back to Books</button>
            <h2 id="chapter-title" class="section-title">JENESISI</h2>
            <div id="chapter-grid" class="grid-container"></div>
        </div>

        <!-- Reading View -->
        <div id="screen-reading" class="screen">
            <div class="reading-header">
                <button class="back-btn" onclick="goToChapters()">←</button>
                <h2 id="reading-title">JENESISI 1</h2>
                <div></div>
            </div>
            <div id="bible-text" class="reading-content">
                <p>Select a chapter to start reading.</p>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation (The modern, "better" way) -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('books')">📖 Books</button>
        <button class="nav-btn" onclick="switchTab('bookmarks')">🔖 Saved</button>
        <button class="nav-btn" onclick="switchTab('settings')">⚙️ Settings</button>
    </nav>

    <!-- Hidden Screens -->
    <div id="screen-bookmarks" class="hidden-screen">
        <h2>Saved Verses</h2>
        <div id="bookmark-list"></div>
        <button class="back-btn" onclick="switchTab('books')">← Back</button>
    </div>
    <div id="screen-settings" class="hidden-screen">
        <h2>About App</h2>
        <p>Bibeli Mimo. World-class speed, 100% offline. Version 1.0.</p>
        <button class="back-btn" onclick="switchTab('books')">← Back</button>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
