<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Read – Bibeli Mimo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B1E39'/><text x='50' y='68' font-size='60' font-family='Georgia,serif' font-weight='bold' fill='%23E8B14B' text-anchor='middle'>B</text></svg>">
  <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="page-container">

        <!-- BOOKS VIEW -->
        <div id="books-view">
            <div class="tab-bar" id="testament-tabs">
                <button class="tab-btn active" data-testament="old">Old Testament</button>
                <button class="tab-btn" data-testament="new">New Testament</button>
            </div>
            <div class="grid-3" id="books-grid"></div>
        </div>

        <!-- CHAPTERS VIEW -->
        <div id="chapters-view" style="display:none;">
            <button class="btn btn-ghost" id="back-to-books" style="margin-bottom:16px; padding:8px 0; color:var(--accent);">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                Back to Books
            </button>
            <h1 class="home-greeting" id="chapter-book-name" style="margin-bottom:16px;">Genesis</h1>
            <div class="grid-4" id="chapters-grid"></div>
        </div>

    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/shared.js"></script>
    <script src="/shared-nav.js"></script>
    <script src="/read/read.js"></script>
</body>
</html>
