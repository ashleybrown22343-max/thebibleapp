<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Page Not Found – Bibeli Mimo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B1E39'/><text x='50' y='68' font-size='60' font-family='Georgia,serif' font-weight='bold' fill='%23E8B14B' text-anchor='middle'>B</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B1E39;
            --card: #142C52;
            --text: #FFFFFF;
            --muted: #8A9BB5;
            --accent: #E8B14B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0B1E39 0%, #142C52 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .box {
            max-width: 420px;
            width: 100%;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin-bottom: 30px;
        }
        .logo span {
            color: var(--text);
        }
        .code {
            font-family: 'Playfair Display', serif;
            font-size: 110px;
            font-weight: 700;
            line-height: 1;
            color: var(--accent);
            margin-bottom: 12px;
            letter-spacing: -3px;
        }
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }
        .desc {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 24px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
            border: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); color: #0B1E39; }
        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn svg { width: 18px; height: 18px; }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">Bibeli <span>Mimo</span></div>
        <div class="code">404</div>
        <div class="title">Page Not Found</div>
        <p class="desc">The page you're looking for doesn't exist or has moved. Let's get you back to the Word.</p>
        <div class="buttons">
            <a href="/" class="btn btn-primary">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Go to Home
            </a>
            <a href="/read/" class="btn btn-secondary">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                Read the Bible
            </a>
            <a href="/discover/search/" class="btn btn-secondary">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Search
            </a>
        </div>
        <div class="footer">Bibeli Mimo · Yoruba & English Bible</div>
    </div>
</body>
    </html>
