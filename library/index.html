<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Library – Bibeli Mimo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B1E39'/><text x='50' y='68' font-size='60' font-family='Georgia,serif' font-weight='bold' fill='%23E8B14B' text-anchor='middle'>B</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Card with corner actions */
        .lib-card {
            position: relative;
            padding: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .lib-card:active {
            transform: scale(0.99);
            box-shadow: var(--shadow-sm);
        }
        .lib-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .lib-card-ref {
            font-family: var(--font-head);
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.4px;
        }
        .lib-card-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .lib-icon-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg);
            color: var(--text-soft);
            transition: background 0.15s, color 0.15s;
        }
        .lib-icon-btn:active {
            background: var(--border);
            color: var(--text);
        }
        .lib-icon-btn.danger:active {
            background: var(--danger);
            color: #fff;
        }
        .lib-icon-btn svg {
            width: 16px;
            height: 16px;
        }

        .lib-verse-yoruba {
            font-family: var(--font-yoruba);
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .lib-verse-english {
            font-size: 13px;
            color: var(--text-soft);
            line-height: 1.55;
        }
        .lib-note-body {
            font-size: 13px;
            font-style: italic;
            color: var(--text);
            margin-top: 10px;
            padding: 10px 12px;
            background: var(--bg);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            line-height: 1.5;
        }
        .lib-highlight-tag {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
            vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .lib-highlight-tag.yellow { background: #F5E47C; }
        .lib-highlight-tag.green { background: #A5D6A7; }
        .lib-highlight-tag.blue { background: #90CAF9; }

        .lib-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-soft);
        }
        .lib-empty svg {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            color: var(--border);
        }
        .lib-empty h3 {
            font-family: var(--font-head);
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .lib-empty p {
            font-size: 13px;
            line-height: 1.5;
        }

        .lib-count {
            display: inline-block;
            min-width: 18px;
            padding: 1px 6px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            margin-left: 6px;
            text-align: center;
        }

        .history-meta {
            font-size: 11px;
            color: var(--text-soft);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <main class="page-container">

        <!-- TABS -->
        <div class="tab-bar" id="library-tabs">
            <button class="tab-btn active" data-tab="saved">Saved</button>
            <button class="tab-btn" data-tab="notes">Notes</button>
            <button class="tab-btn" data-tab="highlights">Marks</button>
            <button class="tab-btn" data-tab="history">History</button>
        </div>

        <div id="tab-content"></div>

    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/shared.js"></script>
    <script src="/shared-nav.js"></script>
    <script src="/library/library.js"></script>
</body>
</html>
